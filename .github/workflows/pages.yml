name: GitHub Pages

on:
  push:
    branches: main
  pull_request:
    branches: main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pages-pr-{0}', github.event.pull_request.number) || 'pages' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    env:
      DASHBOARD_BASE_PATH: /gmina-ozimek/
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - run: corepack enable
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
          cache: yarn
      - id: configurepages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d
      - name: Restore cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: .next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**/yarn.lock') }}-${{ hashFiles('**.[jt]s', '**.[jt]sx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('**/yarn.lock') }}-
      - run: yarn install --immutable
      - run: yarn lint
      - run: yarn build
        env:
          EXPORT: 1
          UNOPTIMIZED: 1
          BASE_PATH: ${{ steps.configurepages.outputs.base_path }}
      - name: Check out the approved dashboard source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: strzelcu/gmina-ozimek-dash
          ref: 65b352ee6ec408ca1d789c92191a978fb125a98e
          path: dashboard-source
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            dashboard-source/package-lock.json
            dashboard-source/dashboard/package-lock.json
      - name: Install and validate the dashboards
        working-directory: dashboard-source
        run: |
          npm ci
          npm ci --prefix dashboard
          node --test tests/*.test.ts
          npm run check --prefix dashboard
      - name: Fetch dashboard data snapshots
        if: github.event_name != 'pull_request'
        working-directory: dashboard-source
        run: npm run data --prefix dashboard
      - name: Build the locality dashboards
        working-directory: dashboard-source
        run: npm run build --prefix dashboard
      - name: Verify waste calendar imports
        working-directory: dashboard-source
        run: |
          python3 -m venv "$RUNNER_TEMP/ozimek-khal"
          "$RUNNER_TEMP/ozimek-khal/bin/python" -m pip install 'khal==0.14.1'
          KHAL_BIN="$RUNNER_TEMP/ozimek-khal/bin/khal" npm run test:calendars --prefix dashboard
      - name: Install Chromium for Playwright
        working-directory: dashboard-source/dashboard
        run: npx playwright install --with-deps --only-shell chromium
      - name: Test the locality dashboards
        id: responsive
        working-directory: dashboard-source
        run: npm run test:responsive --prefix dashboard
      - name: Save browser test results on failure
        if: failure() && steps.responsive.outcome == 'failure'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: dashboard-test-results-${{ github.run_attempt }}
          path: dashboard-source/dashboard/test-results/
          if-no-files-found: ignore
      - name: Add the dashboard catalogue and legacy redirect to the site export
        run: |
          target="out${DASHBOARD_BASE_PATH}"
          mkdir "$target" out/szczedrzyk
          cp -a dashboard-source/dashboard/dist/. "$target"
          cp dashboard-source/redirect/index.html out/szczedrzyk/index.html
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
        if: github.event_name != 'pull_request'
        with:
          path: ./out

  # Deployment job
  deploy:
    if: github.event_name != 'pull_request'
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346
